workflows:
  ios-unsigned-ipa:
    name: Mandarin Reader unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: npx cap add ios
      - name: Patch Info.plist and icon
        script: chmod +x scripts/patch-ios.sh && ./scripts/patch-ios.sh
      - name: Sync web assets
        script: npx cap sync ios
      - name: Build unsigned app
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry MandarinReader.ipa Payload
    artifacts:
      - MandarinReader.ipa
